name: tebyan
description: Tebyan - courses, lectures and QR attendance.
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: 4.6.6

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # QR attendance
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  geolocator: ^14.0.0

  intl: any
  get_storage: ^2.1.1
  hexcolor: ^3.0.1
  flutter_spinkit: ^5.2.0
  google_nav_bar: ^5.0.6
  line_icons: ^2.0.3
  pull_down_button: ^0.9.3

dev_dependencies:
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: ar_font
      fonts:
        - asset: assets/fonts/ar/Montserrat-Arabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ar/Montserrat-Arabic-Regular.ttf
          weight: 400

    - family: en_font
      fonts:
        - asset: assets/fonts/en/Co Headline Bold.otf
        - asset: assets/fonts/en/Co Headline Light.otf

  assets:
    - assets/images/
